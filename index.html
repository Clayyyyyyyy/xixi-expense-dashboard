  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {

    background-attachment: fixed;
  }
  body {
    margin: 0;
    min-height: 100dvh;
    background: linear-gradient(168deg, #ece5d5 0%, #dde6d8 34%, #d3dfe6 68%, #e3d9dd 100%);
    color: #39413f;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  .wrap {
    max-width: 430px; margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
  }
  header { padding: 4px 2px 12px; }
  header .ym { font-size: 13px; letter-spacing: .12em; color: #71807a; }
  header h1 { margin: 2px 0 0; font-size: 26px; font-weight: 700; }
  .card {
    background: rgba(255,255,255,.52);
    border: 1px solid rgba(255,255,255,.65);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 14px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 18px rgba(90,105,95,.08);
  }
  .card h2 { margin: 0 0 4px; font-size: 16px; }
  .card .sub { font-size: 12px; color: #7a877f; margin-bottom: 10px; }
  /* 顶部胶囊 */
  .tabs {
    position: relative; display: flex; padding: 4px; margin-bottom: 14px;
    background: rgba(255,255,255,.45); border: 1px solid rgba(255,255,255,.6);
    border-radius: 999px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #pill {
    position: absolute; top: 4px; left: 4px; height: calc(100% - 8px);
    background: #5b7fa6; border-radius: 999px; z-index: 0;
  }
  #pill.anim { transition: transform .5s cubic-bezier(.22,1,.36,1), width .5s cubic-bezier(.22,1,.36,1); }
  .tabs button {
    flex: 1; position: relative; z-index: 1; border: 0; background: transparent;
    padding: 9px 0; font-size: 15px; color: #5a6862; cursor: pointer;
    transition: color .5s;
  }
  .tabs button.on { color: #fff; font-weight: 600; }
  /* 横向轨道 */
  #viewport { overflow: hidden; touch-action: pan-y; }
  #viewport.animh { transition: height .5s cubic-bezier(.22,1,.36,1); }
  #track { display: flex; gap: 14px; align-items: flex-start; }
  #track.anim { transition: transform .5s cubic-bezier(.22,1,.36,1); }
  .panel { flex: 0 0 100%; min-width: 0; }
  /* 结余大卡 */
  .big-balance { font-size: 38px; font-weight: 750; margin: 2px 0 4px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; }
  .bar-row .lab { width: 34px; color: #66736c; flex: none; }
  .bar-track { flex: 1; height: 9px; border-radius: 99px; background: rgba(90,110,100,.14); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; }
  .bar-fill.inc { background: #7d9b76; width: 100%; }
  .bar-fill.exp { background: #c0857d; }
  .bar-row .val { min-width: 86px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
  /* 指标小卡片：一行 2 个 */
  .sec-title { font-size: 16px; margin: 0 2px 10px; }
  .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .mcard {
    background: rgba(255,255,255,.52); border: 1px solid rgba(255,255,255,.65);
    border-radius: 16px; padding: 12px 14px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 18px rgba(90,105,95,.08);
  }
  .mcard .k { font-size: 12px; color: #77847c; white-space: nowrap; }
  .mcard .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .neg { color: #b3564d; } .pos { color: #5d7f56; }
  /* 饼图 */
  .pie-box { position: relative; }
  .pie-box svg { width: 100%; height: auto; display: block; }
  .pie-box path.slice { cursor: pointer; transition: transform .6s cubic-bezier(.22,1,.36,1), opacity .6s; transform-box: view-box; transform-origin: 176px 100px; }
  .pie-center {
    display: none;
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 118px; padding: 9px 6px; text-align: center; pointer-events: none;
    background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.7);
    border-radius: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .pie-center.show { display: block; }
  .pie-center .n { font-size: 14px; font-weight: 650; white-space: nowrap; }
  .pie-center .p { font-size: 12px; color: #66736c; white-space: nowrap; }
  .pie-center .a { font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 12px; margin-top: 10px; }
  .legend .li { display: flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; overflow: hidden; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .legend .nm { flex: none; } .legend .pc { flex: none; color: #77847c; }
  .legend .am { flex: none; font-variant-numeric: tabular-nums; }
  /* 列表行 */
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px dashed rgba(100,115,105,.16); }
  .row:last-child { border-bottom: 0; }
  .row .l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .r { flex: none; font-variant-numeric: tabular-nums; font-weight: 600; }
  .row .meta { font-size: 12px; color: #7a877f; }
  .cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  /* 每日柱状图 */
  #dailyChart { position: relative; height: 138px; cursor: pointer; }
  #dailyChart .zero { position: absolute; left: 0; right: 0; border-top: 1px solid rgba(90,110,100,.35); }
  #dailyChart .slot { position: absolute; top: 0; height: 100%; }
  #dailyChart .dbar {
    position: absolute; left: 50%; width: 7px; border-radius: 3px; background: #93a8bb;
    transform: translateX(-50%); transition: transform .6s cubic-bezier(.22,1,.36,1), opacity .6s, filter .6s;
  }
  #dailyChart .dbar.peak { background: #5b7fa6; }
  #dailyChart .dbar.refund { background: #7d9b76; }
  #dailyChart.dim .dbar { opacity: .4; }
  #dailyChart .dbar.sel { opacity: 1 !important; filter: brightness(1.18); }
  #dailyChart .peaklab {
    position: absolute; transform: translateX(-50%); font-size: 10px; color: #4d6a88;
    white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none;
  }
  .capsule {
    display: block; width: fit-content; margin: 10px auto 0; padding: 6px 14px;
    background: rgba(91,127,166,.14); border-radius: 999px; font-size: 13px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  /* 月度表与组合图 */
  table.month { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.month th, table.month td { padding: 6px 2px; text-align: right; white-space: nowrap; }
  table.month th:first-child, table.month td:first-child { text-align: left; }
  table.month thead th { color: #77847c; font-weight: 500; border-bottom: 1px solid rgba(100,115,105,.25); }
  table.month tbody tr { border-bottom: 1px dashed rgba(100,115,105,.14); }
  table.month tbody td:first-child { font-weight: 700; }
  table.month tfoot td { font-weight: 700; border-top: 1.5px solid rgba(100,115,105,.35); }
  table.month tr.total td { font-weight: 700; background: rgba(255,255,255,.38); border-bottom: 1.5px solid rgba(100,115,105,.35); }
  .analysis .a-sec { font-size: 14.5px; font-weight: 700; margin: 12px 0 2px; }
  .analysis .a-sec:first-of-type { margin-top: 2px; }
  .analysis .a-item { padding: 7px 0 7px 2px; border-bottom: 1px dashed rgba(100,115,105,.16); font-size: 14px; }
  .analysis .a-item:last-child { border-bottom: 0; }
  /* 分类占比条与名次徽章 */
  .cat-pct { font-size: 11px; color: #aab5ad; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .cat-bar { height: 6px; border-radius: 99px; background: rgba(90,110,100,.12); overflow: hidden; margin: 1px 0 9px; }
  .cat-bar > div { height: 100%; border-radius: 99px; }
  .rank { display: inline-block; min-width: 21px; text-align: center; border-radius: 7px; padding: 1px 3px; margin-right: 7px; font-weight: 700; font-size: 13px; color: #77847c; background: rgba(90,110,100,.08); }
  .rank.r1 { background: #d9a94f; color: #fff; }
  .rank.r2 { background: #a9b6ba; color: #fff; }
  .rank.r3 { background: #c98a68; color: #fff; }
  /* 两行式交易行：左侧序号 / 右侧名称 + 日期tag + 分类tag */
  .tx-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px dashed rgba(100,115,105,.16); }
  .tx-row:last-child { border-bottom: 0; }
  .tx-row .rank { margin-top: 2px; flex: none; }
  .tx-main { flex: 1; min-width: 0; }
  .tx-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 550; }
  .tx-tags { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.4; }
  .tag-date { background: rgba(90,110,100,.10); color: #66736c; }
  .tx-amt { flex: none; font-variant-numeric: tabular-nums; font-weight: 650; padding-top: 1px; }
  footer { text-align: center; font-size: 12px; color: #84918a; padding: 2px 0 0; line-height: 1.7; }
</style>

(function pie() {
  const svg = document.getElementById("pieSvg");
  const center = document.getElementById("pieCenter");
  const legend = document.getElementById("pieLegend");
  const items = (DATA.pie || []).filter(p => p.amount > 0);
  const total = items.reduce((s, p) => s + p.amount, 0);
  const cx = 176, cy = 100, r = 82;
  let sel = -1, acc = -Math.PI / 2;
  const paths = [];
  function pt(a) { return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
  function showCenter() {
    if (sel < 0) {
      center.classList.remove("show");
      center.innerHTML = "";
    } else {
      const p = items[sel];
      center.classList.add("show");
      center.innerHTML = `<div class="n">${esc(p.name)}</div><div class="p">占比 ${p.pct.toFixed(1)}%</div><div class="a">${fmt(p.amount)}</div>`;
    }
  }
  items.forEach((p, i) => {
    const frac = total ? p.amount / total : 0;
    const a0 = acc, a1 = acc + frac * Math.PI * 2;
    acc = a1;
    let d;
    if (frac >= 0.9999) {
      d = `M ${cx} ${cy} m ${-r} 0 a ${r} ${r} 0 1 0 ${2 * r} 0 a ${r} ${r} 0 1 0 ${-2 * r} 0 Z`;
    } else {
      const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
      d = `M ${cx} ${cy} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${frac > 0.5 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
    }
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", PIE_COLORS[i % PIE_COLORS.length]);
    path.classList.add("slice");
    path.addEventListener("click", ev => {
      ev.stopPropagation();
      sel = (sel === i) ? -1 : i;
      paths.forEach((q, j) => {
        q.style.transform = (j === sel) ? "scale(1.07)" : "";
        q.style.opacity = (sel < 0 || j === sel) ? "1" : "0.4";
        q.style.filter = (j === sel) ? "brightness(1.13)" : "";
      });
      showCenter();
    });
    svg.appendChild(path);
    paths.push(path);
  });
  legend.innerHTML = items.map((p, i) =>
    `<div class="li"><span class="dot" style="background:${PIE_DARK[i % PIE_DARK.length]}"></span><span class="nm">${esc(p.name)}</span><span class="pc">${p.pct.toFixed(1)}%</span><span class="am">${fmt(p.amount)}</span></div>`).join("");
  showCenter();
})();

(function dailyChart() {
  const box = document.getElementById("dailyChart");

  const days = D.days || [];

  // 顶部留 22px 给峰值金额标签，避免标签与最高柱重合；底部留 4px

  const zero = document.createElement("div");
  zero.className = "zero"; zero.style.top = zeroY + "px";

    const bar = document.createElement("div");

    else { bar.style.top = zeroY + "px"; bar.style.transformOrigin = "50% 0%"; }
    slot.appendChild(bar);
    bars.push(bar);
    slot.addEventListener("click", ev => {
      ev.stopPropagation();
      select(sel === i ? -1 : i);
    });
    box.appendChild(slot);
    if (i === D.max.index) {
      const lab = document.createElement("div");

      lab.style.top = Math.max(0, zeroY - h - 14) + "px";
      box.appendChild(lab);
    }
  });
  function select(i) {
    sel = i;
    box.classList.toggle("dim", sel >= 0);
    bars.forEach((b, j) => {
      b.classList.toggle("sel", j === sel);
      b.style.transform = j === sel ? "translateX(-50%) scale(1.4, 1.08)" : "translateX(-50%)";

})();

(function tabsSwipe() {
  const vp = document.getElementById("viewport");
  const track = document.getElementById("track");
  const pill = document.getElementById("pill");
  const btns = [...document.querySelectorAll(".tabs button")];
  const panels = [...document.querySelectorAll(".panel")];
  const GAP = 14;
  let cur = 0, suppressClick = false;
  const step = () => vp.clientWidth + GAP;
  const heights = () => panels.map(p => p.offsetHeight);
  function pillTo(idx, frac) {
    const w = btns[0].offsetWidth;
    pill.style.width = w + "px";
    pill.style.transform = `translateX(${(idx + (frac || 0)) * w}px)`;
  }
  function apply(offsetPx) {
    track.style.transform = `translateX(${-cur * step() + (offsetPx || 0)}px)`;
  }
  function setHeight(h) { vp.style.height = h + "px"; }
  function goTo(i, animate = true) {
    cur = Math.max(0, Math.min(panels.length - 1, i));
    btns.forEach((b, j) => b.classList.toggle("on", j === cur));
    track.classList.toggle("anim", animate);
    vp.classList.toggle("animh", animate);
    pill.classList.toggle("anim", animate);
    apply(0); pillTo(cur, 0); setHeight(heights()[cur]);
    if (animate) setTimeout(() => { track.classList.remove("anim"); vp.classList.remove("animh"); pill.classList.remove("anim"); }, 520);
  }
  btns.forEach(b => b.addEventListener("click", () => goTo(+b.dataset.i)));
  // 初始化
  requestAnimationFrame(() => { pillTo(0, 0); apply(0); setHeight(heights()[0]); });
  window.addEventListener("resize", () => { pillTo(cur, 0); apply(0); setHeight(heights()[cur]); });

  let startX = 0, startY = 0, startT = 0, dragging = false, dx = 0;
  vp.addEventListener("pointerdown", e => {
    startX = e.clientX; startY = e.clientY; startT = performance.now();
    dx = 0; dragging = false;
  });
  vp.addEventListener("pointermove", e => {
    if (!startT) return;
    const mx = e.clientX - startX, my = e.clientY - startY;
    if (!dragging && Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my) * 1.4) {
      dragging = true;
      track.classList.remove("anim"); vp.classList.remove("animh"); pill.classList.remove("anim");
    }
    if (!dragging) return;
    dx = mx;
    let eff = dx;
    if ((cur === 0 && dx > 0) || (cur === panels.length - 1 && dx < 0)) eff = dx * 0.3; // 边缘阻尼
    apply(eff);
    const prog = Math.max(-1, Math.min(1, -eff / step()));
    pillTo(cur, prog);
    const hs = heights();
    const target = prog > 0 ? Math.min(panels.length - 1, cur + 1) : Math.max(0, cur - 1);
    const f = Math.abs(prog);
    setHeight(hs[cur] + (hs[target] - hs[cur]) * f);
  });
  function endDrag() {
    if (!startT) return;
    const dt = Math.max(1, performance.now() - startT);
    startT = 0;
    if (!dragging) return;
    dragging = false;
    suppressClick = true;
    setTimeout(() => suppressClick = false, 80);
    let eff = dx;
    if ((cur === 0 && dx > 0) || (cur === panels.length - 1 && dx < 0)) eff = dx * 0.3;
    const dist = Math.abs(eff), vel = Math.abs(dx) / dt;
    let target = cur;
    if (eff < 0 && (dist > step() / 4 || (Math.abs(dx) > 50 && vel > 0.5))) target = cur + 1;
    if (eff > 0 && (dist > step() / 4 || (Math.abs(dx) > 50 && vel > 0.5))) target = cur - 1;
    goTo(target, true);
    dx = 0;
  }
  vp.addEventListener("pointerup", endDrag);
  vp.addEventListener("pointercancel", endDrag);
  vp.addEventListener("click", e => {
    if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; }
  }, true);
})();
</script>
</body>
</html>
